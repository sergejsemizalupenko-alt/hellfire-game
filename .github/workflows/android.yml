run-name: INTERNET WAKE Lite network-only APK
name: Build INTERNET WAKE Lite APK
on:
  push:
    branches: [internet-wake-android, internet-wake-speedtest, internet-wake-speedtest-2.3, internet-wake-speedtest-2.4, internet-wake-lite]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable signing key
        env:
          IW_KEYSTORE_BASE64: ${{ secrets.IW_KEYSTORE_BASE64 }}
        run: |
          test -n "$IW_KEYSTORE_BASE64" || (echo "Missing IW_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$IW_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
      - name: Build debug APK
        env:
          IW_KEYSTORE_PASSWORD: ${{ secrets.IW_KEYSTORE_PASSWORD }}
          IW_KEY_ALIAS: ${{ secrets.IW_KEY_ALIAS }}
          IW_KEY_PASSWORD: ${{ secrets.IW_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: internet-wake-lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
