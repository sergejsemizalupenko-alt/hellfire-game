<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07182d"><title>INTERNET WAKE Lite</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px 14px 28px;background:radial-gradient(ellipse at 50% -15%,#174b78 0,#0b2542 42%,#061323 100%);color:#edf7ff;font-family:Arial,sans-serif;text-align:center}.container{max-width:460px;margin:8px auto;padding:22px 18px;background:linear-gradient(145deg,rgba(25,57,85,.96),rgba(12,29,48,.98));border:1px solid #2c6489;border-radius:25px;box-shadow:0 18px 45px #0008}h1{margin:2px 0 5px;font-size:29px;letter-spacing:1.5px;color:#72d8ff;text-shadow:0 0 18px #1aa9ff88}.subtitle{margin:0 0 22px;color:#a9c9df;font-size:14px}.status{padding:22px 14px;margin:0 0 16px;border:1px solid #3e6078;border-radius:19px;background:linear-gradient(145deg,#142e47,#10243a);box-shadow:inset 0 1px #ffffff12}.status-label{font-size:12px;letter-spacing:2px;color:#91b5ce}.status-value{display:block;margin:10px 0 0;font-size:21px;font-weight:800;letter-spacing:.7px;color:#ffc857;text-shadow:0 0 15px currentColor}.serverline{margin-top:16px;padding-top:13px;border-top:1px solid #34516a;color:#c5d9e8;font-size:14px}.serverline b{font-size:25px;color:#66e6ae;margin-left:8px;text-shadow:0 0 15px #38df9a66}.interval{padding:16px;margin-bottom:13px;border-radius:16px;background:#0b2035;border:1px solid #315776}.interval label{display:block;margin-bottom:10px;color:#c3d9e9;font-size:14px}.interval input{width:145px;padding:10px;border:1px solid #4b91b8;border-radius:11px;background:#07182a;color:#fff;text-align:center;font-size:23px;font-weight:bold;outline:none}.interval input:disabled{opacity:.7}button{width:100%;padding:16px;margin:7px 0;border:0;border-radius:14px;color:#fff;font-size:16px;font-weight:800;letter-spacing:1px;box-shadow:0 6px 18px #0005}button:disabled{opacity:.35}#start{background:linear-gradient(110deg,#12a96d,#087e70)}#stop{background:linear-gradient(110deg,#ef5263,#b52d49)}.logtitle{margin:23px 0 9px;text-align:left;color:#8edcff;font-size:13px;font-weight:bold;letter-spacing:1.5px}.log{height:255px;overflow:auto;padding:12px;text-align:left;background:#061321;border:1px solid #24435d;border-radius:14px;font-size:12px;color:#d2e2ee;overflow-wrap:anywhere}.entry{padding:7px 2px;border-bottom:1px solid #1c3449;line-height:1.4}.entry:last-child{border:0}.entry.good{color:#70e4ad}.entry.warn{color:#ffd166}.entry.bad{color:#ff7d8c}.foot{margin:18px 0 0;color:#6f93ad;font-size:11px;letter-spacing:.4px}
</style></head><body><main class="container"><h1>INTERNET WAKE</h1><p class="subtitle">Периодические сетевые запросы</p>
<section class="status"><div class="status-label">СОСТОЯНИЕ МОНИТОРИНГА</div><span id="status" class="status-value">ОЖИДАНИЕ ЗАПУСКА</span><div id="serverBox" class="serverline" style="display:none">Активных серверов <b id="serverCount">—/5</b></div></section>
<section class="interval"><label for="interval">ИНТЕРВАЛ ЗАПРОСОВ · СЕКУНДЫ</label><input id="interval" type="number" value="10" min="5" max="3600"></section>
<button id="start" onclick="startMonitoring()">▶ ЗАПУСТИТЬ</button><button id="stop" onclick="stopMonitoring()" disabled>■ ОСТАНОВИТЬ</button>
<div class="logtitle">ЖУРНАЛ СЕТЕВЫХ ЗАПРОСОВ</div><div class="log" id="log">Подготовка журнала…</div><p class="foot">NETWORK EDITION · ФОНОВАЯ СЛУЖБА ANDROID</p></main>
<script>
"use strict";
const logEl=document.getElementById("log"),statusEl=document.getElementById("status"),serverBox=document.getElementById("serverBox"),serverCount=document.getElementById("serverCount");
function addLog(message,time=Date.now()){const d=document.createElement("div");d.className="entry";if(/нет ответа|ошибка|недоступ/i.test(message))d.classList.add("bad");else if(/резерв|частично|активных серверов [0-4]\//i.test(message))d.classList.add("warn");else if(/доступен|активных серверов 5\//i.test(message))d.classList.add("good");d.textContent="["+new Date(time).toLocaleTimeString()+"] "+message;logEl.prepend(d);while(logEl.children.length>500)logEl.lastChild.remove();}
function setStatus(text,color){statusEl.textContent=text;statusEl.style.color=color;}
function setCount(n){serverBox.style.display="block";serverCount.textContent=n+"/5";if(n===0)setStatus("НЕТ ДОСТУПНЫХ СЕРВЕРОВ","#ff6578");else if(n<5)setStatus("ЧАСТИЧНАЯ ДОСТУПНОСТЬ","#ffd166");else setStatus("МОНИТОРИНГ АКТИВЕН","#65e6a8");}
function startMonitoring(){const n=Number(document.getElementById("interval").value);if(!Number.isInteger(n)||n<5||n>3600){alert("Укажи интервал от 5 до 3600 секунд.");return;}AndroidWake.start(n);document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("interval").disabled=true;setStatus("ЗАПУСК СЛУЖБЫ…","#ffd166");}
function stopMonitoring(){AndroidWake.stop();document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;document.getElementById("interval").disabled=false;setStatus("ОСТАНОВЛЕНО","#ffd166");serverBox.style.display="none";}
window.onNativeEvent=function(e){if(e.type!=="log")return;addLog(e.message,e.time);const m=e.message.match(/активных серверов\s+(\d+)\/5/);if(m)setCount(Number(m[1]));else if(e.message.startsWith("Цикл №")&&e.message.includes("нет ответа"))setCount(0);if(e.message==="Мониторинг остановлен."){setStatus("ОСТАНОВЛЕНО","#ffd166");serverBox.style.display="none";document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;document.getElementById("interval").disabled=false;}if(e.message.startsWith("Мониторинг запущен"))setStatus("МОНИТОРИНГ ЗАПУЩЕН","#65e6a8");};
try{const s=JSON.parse(AndroidWake.state());logEl.textContent="";(s.entries||[]).forEach(e=>{addLog(e.message,e.time);const m=e.message.match(/активных серверов\s+(\d+)\/5/);if(m)setCount(Number(m[1]));else if(e.message.startsWith("Цикл №")&&e.message.includes("нет ответа"))setCount(0);});if(s.running){document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("interval").disabled=true;setStatus("МОНИТОРИНГ АКТИВЕН","#65e6a8");}else setStatus("ОЖИДАНИЕ ЗАПУСКА","#ffd166");}catch(e){logEl.textContent="Не удалось восстановить журнал.";}
</script></body></html>
