<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>INTERNET WAKE</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#101820;color:#fff;font-family:Arial,sans-serif;text-align:center}.container{max-width:440px;margin:18px auto;padding:22px;background:#1c2935;border-radius:18px}h1{font-size:25px;color:#55c8ff}.status{margin:20px 0;padding:18px;background:#303e4b;border-radius:12px;font-size:17px}#status{font-weight:bold;color:#ffc857}button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:10px;font-size:17px;font-weight:bold;color:#fff}#start{background:#168b50}#stop{background:#bd3545}button:disabled{opacity:.45}input{width:100px;padding:10px;font-size:17px;text-align:center;border-radius:6px}.log{margin-top:18px;padding:12px;height:310px;overflow:auto;text-align:left;font-size:13px;background:#101820;border-radius:8px;overflow-wrap:anywhere}.entry{padding:4px 0;border-bottom:1px solid #263440}.small{color:#9aabb9;font-size:12px;margin-top:16px}
</style></head><body><div class="container"><h1>INTERNET WAKE</h1><p>Мониторинг сети и тест скорости LibreSpeed</p>
<div class="status">Состояние:<br><br><span id="status">Ожидание запуска</span></div>
<p>Интервал запросов (секунд)</p><input id="interval" type="number" value="10" min="5" max="3600">
<button id="start" onclick="startMonitoring()">ЗАПУСТИТЬ МОНИТОРИНГ</button><button id="stop" onclick="stopMonitoring()" disabled>ОСТАНОВИТЬ МОНИТОРИНГ</button><div class="status"><b>ТЕСТ СКОРОСТИ</b><br><br><div id="ping">Ping: —</div><div id="jitter">Jitter: —</div><div id="download">Download: —</div><div id="upload">Upload: —</div><div id="server">Сервер: —</div><button id="speed" onclick="runSpeedTest()" style="background:#176dba;margin-top:14px">ПРОВЕРИТЬ СКОРОСТЬ</button></div>
<div class="log" id="log">Загрузка журнала…</div><p class="small">INTERNET WAKE v2.2<br>Фоновая служба Android • Тест скорости LibreSpeed</p></div>
<script>
"use strict";
const logEl=document.getElementById("log");
function addLog(message,time=Date.now()){const d=document.createElement("div");d.className="entry";d.textContent="["+new Date(time).toLocaleTimeString()+"] "+message;logEl.prepend(d);while(logEl.children.length>500)logEl.lastChild.remove();}
function setStatus(s,color="#42e68b"){const e=document.getElementById("status");e.textContent=s;e.style.color=color;}
function startMonitoring(){const n=Number(document.getElementById("interval").value);if(!Number.isFinite(n)||n<5||n>3600){alert("Укажи интервал от 5 до 3600 секунд.");return;}AndroidWake.start(n);document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("interval").disabled=true;setStatus("ЗАПУСК СЛУЖБЫ…","#ffc857");}
function runSpeedTest(){const b=document.getElementById("speed");b.disabled=true;b.textContent="ТЕСТИРОВАНИЕ…";AndroidWake.speedTest();}
function stopMonitoring(){AndroidWake.stop();document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;document.getElementById("interval").disabled=false;setStatus("ОСТАНОВЛЕНО","#ffc857");}
window.onNativeEvent=function(e){if(e.type==="speed"){if(e.stage==="server")document.getElementById("server").textContent="Сервер: "+e.name;if(e.stage==="ping")document.getElementById("ping").textContent="Ping: "+e.value+" мс";if(e.stage==="jitter")document.getElementById("jitter").textContent="Jitter: "+e.value+" мс";if(e.stage==="download")document.getElementById("download").textContent="Download: "+e.value+" Мбит/с";if(e.stage==="upload")document.getElementById("upload").textContent="Upload: "+e.value+" Мбит/с";if(e.stage==="done"||e.stage==="error"){document.getElementById("speed").disabled=false;document.getElementById("speed").textContent="ПРОВЕРИТЬ СКОРОСТЬ";}}if(e.type==="log"){addLog(e.message,e.time);if(e.message.startsWith("Мониторинг запущен")||e.message.startsWith("Цикл №")||e.message.includes("активных серверов"))setStatus("МОНИТОРИНГ АКТИВЕН");if(e.message==="Мониторинг остановлен.")setStatus("ОСТАНОВЛЕНО","#ffc857");}};
try{const s=JSON.parse(AndroidWake.state());logEl.textContent="";(s.entries||[]).forEach(e=>addLog(e.message,e.time));if(s.running){document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("interval").disabled=true;setStatus("МОНИТОРИНГ АКТИВЕН");}else setStatus("ОЖИДАНИЕ ЗАПУСКА","#ffc857");}catch(e){logEl.textContent="Не удалось восстановить журнал.";}
</script></body></html>
