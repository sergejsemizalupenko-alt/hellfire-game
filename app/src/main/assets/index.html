<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07182d"><title>INTERNET WAKE Lite</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px 14px 28px;background:radial-gradient(ellipse at 50% -15%,#174b78 0,#0b2542 42%,#061323 100%);color:#edf7ff;font-family:Arial,sans-serif;text-align:center}.container{max-width:460px;margin:8px auto;padding:22px 18px;background:linear-gradient(145deg,rgba(25,57,85,.96),rgba(12,29,48,.98));border:1px solid #2c6489;border-radius:25px;box-shadow:0 18px 45px #0008}h1{margin:2px 0 5px;font-size:29px;letter-spacing:1.5px;color:#72d8ff;text-shadow:0 0 18px #1aa9ff88}.subtitle{margin:0 0 22px;color:#a9c9df;font-size:14px}.clockbar{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;margin:0 0 14px;border:1px solid #315776;border-radius:15px;background:#0b2035;text-align:left}.clockitem{display:flex;flex-direction:column;gap:5px}.clocklabel{font-size:10px;letter-spacing:1px;color:#91b5ce}.clockvalue{font-size:19px;font-weight:800;color:#8edcff;font-variant-numeric:tabular-nums}.clockvalue.uptime{color:#70e4ad}.status{padding:22px 14px;margin:0 0 16px;border:1px solid #3e6078;border-radius:19px;background:linear-gradient(145deg,#142e47,#10243a);box-shadow:inset 0 1px #ffffff12}.status-label{font-size:12px;letter-spacing:2px;color:#91b5ce}.status-value{display:block;margin:10px 0 0;font-size:21px;font-weight:800;letter-spacing:.7px;color:#ffc857;text-shadow:0 0 15px currentColor}.serverline{margin-top:16px;padding-top:13px;border-top:1px solid #34516a;color:#c5d9e8;font-size:14px}.serverline b{font-size:25px;color:#66e6ae;margin-left:8px;text-shadow:0 0 15px #38df9a66}.interval{padding:16px;margin-bottom:13px;border-radius:16px;background:#0b2035;border:1px solid #315776}.interval label{display:block;margin-bottom:10px;color:#c3d9e9;font-size:14px}.interval input{width:145px;padding:10px;border:1px solid #4b91b8;border-radius:11px;background:#07182a;color:#fff;text-align:center;font-size:23px;font-weight:bold;outline:none}.interval input:disabled{opacity:.7}button{width:100%;padding:16px;margin:7px 0;border:0;border-radius:14px;color:#fff;font-size:16px;font-weight:800;letter-spacing:1px;box-shadow:0 6px 18px #0005}button:disabled{opacity:.35}#start{background:linear-gradient(110deg,#12a96d,#087e70)}#stop{background:linear-gradient(110deg,#ef5263,#b52d49)}.logtitle{margin:23px 0 9px;text-align:left;color:#8edcff;font-size:13px;font-weight:bold;letter-spacing:1.5px}.log{height:255px;overflow:auto;padding:12px;text-align:left;background:#061321;border:1px solid #24435d;border-radius:14px;font-size:12px;color:#d2e2ee;overflow-wrap:anywhere}.entry{padding:7px 2px;border-bottom:1px solid #1c3449;line-height:1.4}.entry:last-child{border:0}.entry.good{color:#70e4ad}.entry.warn{color:#ffd166}.entry.bad{color:#ff7d8c}.foot{margin:18px 0 0;color:#6f93ad;font-size:11px;letter-spacing:.4px}.settings{margin:12px 0 16px;padding:14px 13px;border:1px solid #315776;border-radius:14px;background:#0b2035;text-align:left;color:#c3d9e9;font-size:13px;line-height:1.45}.settings label{display:flex;align-items:flex-start;gap:10px;cursor:pointer}.settings input{width:18px;height:18px;flex:0 0 18px;margin:1px 0 0;accent-color:#28c88b}.settings #overlayHint{margin:8px 0 0 28px;color:#89abc2;font-size:11px}
</style></head><body><main class="container"><h1>INTERNET WAKE</h1><p class="subtitle">Периодические сетевые запросы</p>
<section class="clockbar"><div class="clockitem"><span class="clocklabel">ТЕКУЩЕЕ ВРЕМЯ</span><span class="clockvalue" id="clock">--:--:--</span></div><div class="clockitem" style="text-align:right"><span class="clocklabel">ВРЕМЯ РАБОТЫ</span><span class="clockvalue uptime" id="uptime">00:00:00</span></div></section>
<section class="status"><div class="status-label">СОСТОЯНИЕ МОНИТОРИНГА</div><span id="status" class="status-value">ОЖИДАНИЕ ЗАПУСКА</span><div id="serverBox" class="serverline" style="display:none">Активных серверов <b id="serverCount">—/5</b></div></section>
<section class="interval"><label for="interval">ИНТЕРВАЛ ЗАПРОСОВ · СЕКУНДЫ</label><input id="interval" type="number" value="5" min="5" max="3600"></section>
<section class="settings"><label><input id="overlayToggle" type="checkbox"> Показывать плавающую точку состояния поверх других приложений</label><div id="overlayHint">Точка отображается во время мониторинга.</div></section>
<button id="start" onclick="startMonitoring()">▶ ЗАПУСТИТЬ</button><button id="stop" onclick="stopMonitoring()" disabled>■ ОСТАНОВИТЬ</button>

<div class="logtitle">ЖУРНАЛ СЕТЕВЫХ ЗАПРОСОВ</div><div class="log" id="log">Подготовка журнала…</div><p class="foot">NETWORK EDITION · ФОНОВАЯ СЛУЖБА ANDROID</p></main>
<script>
"use strict";
const logEl=document.getElementById("log"),statusEl=document.getElementById("status"),serverBox=document.getElementById("serverBox"),serverCount=document.getElementById("serverCount");
let monitoringStartedAt=0;
function pad(n){return String(n).padStart(2,"0")}
function formatDuration(ms){let s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function updateClocks(){document.getElementById("clock").textContent=new Date().toLocaleTimeString();document.getElementById("uptime").textContent=monitoringStartedAt?formatDuration(Date.now()-monitoringStartedAt):"00:00:00"}
setInterval(updateClocks,1000);updateClocks();
function addLog(message,time=Date.now()){const d=document.createElement("div");d.className="entry";if(/нет ответа|ошибка|недоступ/i.test(message))d.classList.add("bad");else if(/резерв|частично|активных серверов [0-4]\//i.test(message))d.classList.add("warn");else if(/доступен|активных серверов 5\//i.test(message))d.classList.add("good");d.textContent="["+new Date(time).toLocaleTimeString()+"] "+message;logEl.prepend(d);while(logEl.children.length>500)logEl.lastChild.remove();}
function setStatus(text,color){statusEl.textContent=text;statusEl.style.color=color;}
function setCount(n){serverBox.style.display="block";serverCount.textContent=n+"/5";serverCount.style.color=n===5?"#66e6ae":n===0?"#ff6578":"#ffd166";}
function startMonitoring(){const n=Number(document.getElementById("interval").value);if(!Number.isInteger(n)||n<5||n>3600){alert("Укажи интервал от 5 до 3600 секунд.");return;}monitoringStartedAt=Date.now();updateClocks();AndroidWake.start(n);document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("interval").disabled=true;setStatus("ЗАПУСК СЛУЖБЫ…","#ffd166");}
function stopMonitoring(){AndroidWake.stop();monitoringStartedAt=0;updateClocks();document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;document.getElementById("interval").disabled=false;setStatus("ОСТАНОВЛЕНО","#ffd166");serverBox.style.display="none";}
window.onNativeEvent=function(e){if(e.type!=="log")return;addLog(e.message,e.time);const m=e.message.match(/активных серверов\s+(\d+)\/5/);if(m)setCount(Number(m[1]));else if(e.message.startsWith("Цикл №")&&e.message.includes("нет ответа"))setCount(0);if(e.message==="Мониторинг остановлен."){monitoringStartedAt=0;updateClocks();setStatus("ОСТАНОВЛЕНО","#ffd166");serverBox.style.display="none";document.getElementById("start").disabled=false;document.getElementById("stop").disabled=true;document.getElementById("interval").disabled=false;}if(e.message.startsWith("Мониторинг запущен")){if(!monitoringStartedAt)monitoringStartedAt=Date.now();updateClocks();setStatus("МОНИТОРИНГ ЗАПУЩЕН","#65e6a8");}};
function refreshJournal(){try{const s=JSON.parse(AndroidWake.state());logEl.textContent="";(s.entries||[]).forEach(e=>{addLog(e.message,e.time);const m=e.message.match(/активных серверов\s+(\d+)\/5/);if(m)setCount(Number(m[1]));});if(s.running){monitoringStartedAt=Number(s.startedAt)||Date.now();updateClocks();document.getElementById("start").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("interval").disabled=true;setStatus("МОНИТОРИНГ АКТИВЕН","#65e6a8");}else setStatus("ОЖИДАНИЕ ЗАПУСКА","#ffd166");document.getElementById("overlayToggle").checked=AndroidWake.overlayEnabled();document.getElementById("overlayHint").textContent=AndroidWake.overlayPermissionGranted()?"Разрешение на показ поверх окон предоставлено.":"Для плавающей точки требуется разрешение Android."; }catch(e){logEl.textContent="Не удалось восстановить журнал.";}}window.refreshFromNative=refreshJournal;window.onAppResume=refreshJournal;document.getElementById("overlayToggle").addEventListener("change",e=>AndroidWake.setOverlayEnabled(e.target.checked));refreshJournal();
</script></body></html>
